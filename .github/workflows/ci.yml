name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and Mesa (software OpenGL, no graphics card)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libopengl-dev libgl-dev libegl-dev libegl1 libegl-mesa0 libgl1-mesa-dri doctest-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test shaders against the CPU reference
        run: ctest --test-dir build --output-on-failure -V
